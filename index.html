<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday 0927</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1016;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .stage.active {
      display: flex !important;
    }

    /* 阶段 1：密码锁 */
    .lock-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .lock-title {
      font-size: 20px;
      color: #ff9ab2;
      margin-bottom: 6px;
    }
    .lock-hint {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 16px;
    }
    .pass-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ff9ab2;
      background: transparent;
      transition: all 0.2s;
    }
    .dot.filled {
      background: #ff9ab2;
      transform: scale(1.15);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key {
      height: 50px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
    }
    .key:active {
      background: rgba(255, 154, 178, 0.4);
    }

    /* 阶段 2：时光气球 */
    .balloon-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .balloon-title {
      font-size: 22px;
      color: #ff9ab2;
      margin-bottom: 6px;
    }
    .balloon-sub {
      font-size: 13px;
      color: #bbb;
    }
    .balloon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 14px;
      max-width: 330px;
      width: 100%;
    }
    .balloon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: float 3s ease-in-out infinite alternate;
    }
    .balloon-wrapper:nth-child(2) { animation-delay: 0.4s; }
    .balloon-wrapper:nth-child(3) { animation-delay: 0.8s; }
    .balloon-wrapper:nth-child(4) { animation-delay: 1.2s; }
    .balloon-wrapper:nth-child(5) { animation-delay: 0.6s; }
    .balloon-wrapper:nth-child(6) { animation-delay: 1s; }
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    .balloon {
      width: 68px;
      height: 82px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 6px solid currentColor;
    }
    .string {
      width: 1.5px;
      height: 20px;
      background: rgba(255, 255, 255, 0.4);
      margin-top: 4px;
    }
    .btn-next {
      margin-top: 30px;
      padding: 12px 28px;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff9ab2, #ff6b8b);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(255, 107, 139, 0.4);
      cursor: pointer;
      display: none;
    }

    /* 照片弹窗 */
    .photo-modal {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .polaroid {
      background: #ffffff;
      padding: 10px 10px 18px 10px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .polaroid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }
    .photo-text {
      color: #2c2c2c;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
    }
    .modal-close-tip {
      margin-top: 16px;
      font-size: 13px;
      color: #ddd;
    }

    /* 阶段 3：吹蜡烛 */
    .cake {
      position: relative;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .candle {
      width: 12px;
      height: 40px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff708d 5px, #ff708d 10px);
      border-radius: 4px;
      position: relative;
    }
    .flame {
      width: 16px;
      height: 22px;
      background: #ffab00;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -22px;
      left: -2px;
      box-shadow: 0 0 14px #ffab00;
      transition: all 0.3s;
    }
    .cake-tier2 {
      width: 110px;
      height: 55px;
      background: #ffd6e0;
      border-radius: 12px 12px 4px 4px;
    }
    .cake-tier1 {
      width: 160px;
      height: 65px;
      background: #ffe5ec;
      border-radius: 14px 14px 4px 4px;
      margin-top: -6px;
    }
    .blow-btn {
      margin-top: 36px;
      padding: 13px 32px;
      border-radius: 30px;
      background: #ff9ab2;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 154, 178, 0.4);
    }

    /* 阶段 4：烟花 & 特权券 */
    #canvas-fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .final-content {
      position: relative;
      z-index: 25;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .final-title {
      font-size: 24px;
      color: #ffda79;
      text-align: center;
      margin-bottom: 6px;
    }
    .final-sub {
      font-size: 13px;
      color: #eee;
      text-align: center;
      margin-bottom: 18px;
    }
    .coupons-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .coupon-card {
      background: rgba(30, 32, 45, 0.95);
      border: 1px solid rgba(255, 218, 121, 0.4);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .coupon-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .coupon-title {
      font-size: 15px;
      color: #ffda79;
      font-weight: bold;
    }
    .coupon-desc {
      font-size: 12px;
      color: #cccccc;
    }
    .coupon-tag {
      background: rgba(255, 218, 121, 0.15);
      border: 1px dashed #ffda79;
      color: #ffda79;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .coupon-tag.used {
      background: rgba(255, 255, 255, 0.1);
      border-color: #666;
      color: #777;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <canvas id="canvas-fireworks"></canvas>

    <!-- 阶段 1 -->
    <div class="stage active" id="stage-pass">
      <div class="lock-box">
        <div class="lock-title">专属时光锁</div>
        <div class="lock-hint">输入你的4位生日暗号开启</div>
        <div class="pass-dots">
          <div class="dot" id="d0"></div>
          <div class="dot" id="d1"></div>
          <div class="dot" id="d2"></div>
          <div class="dot" id="d3"></div>
        </div>
        <div class="keypad">
          <button class="key" data-k="1">1</button>
          <button class="key" data-k="2">2</button>
          <button class="key" data-k="3">3</button>
          <button class="key" data-k="4">4</button>
          <button class="key" data-k="5">5</button>
          <button class="key" data-k="6">6</button>
          <button class="key" data-k="7">7</button>
          <button class="key" data-k="8">8</button>
          <button class="key" data-k="9">9</button>
          <button class="key" id="btn-clear" style="font-size:14px;color:#aaa;">清空</button>
          <button class="key" data-k="0">0</button>
          <button class="key" id="btn-back" style="font-size:14px;color:#ff9ab2;">⌫</button>
        </div>
      </div>
    </div>

    <!-- 阶段 2 -->
    <div class="stage" id="stage-balloons">
      <div class="balloon-header">
        <div class="balloon-title">🎈 时光记忆气球</div>
        <div class="balloon-sub" id="explore-progress">已探索: 0 / 6</div>
      </div>
      <div class="balloon-grid">
        <div class="balloon-wrapper" data-idx="0">
          <div class="balloon" style="background:#ff758c; color:#ff758c;">1</div>
          <div class="string"></div>
        </div>
        <div class="balloon-wrapper" data-idx="1">
          <div class="balloon" style="background:#4facfe; color:#4facfe;">2</div>
          <div class="string"></div>
        </div>
        <div class="balloon-wrapper" data-idx="2">
          <div class="balloon" style="background:#43e97b; color:#43e97b;">3</div>
          <div class="string"></div>
        </div>
        <div class="balloon-wrapper" data-idx="3">
          <div class="balloon" style="background:#fa709a; color:#fa709a;">4</div>
          <div class="string"></div>
        </div>
        <div class="balloon-wrapper" data-idx="4">
          <div class="balloon" style="background:#f6d365; color:#f6d365;">5</div>
          <div class="string"></div>
        </div>
        <div class="balloon-wrapper" data-idx="5">
          <div class="balloon" style="background:#a18cd1; color:#a18cd1;">6</div>
          <div class="string"></div>
        </div>
      </div>
      <button class="btn-next" id="btn-to-cake">开启生日蛋糕 🎂</button>
    </div>

    <!-- 照片弹窗 -->
    <div class="photo-modal" id="photo-modal">
      <div class="polaroid" id="polaroid-card">
        <img id="modal-img" src="" alt="Photo">
        <div class="photo-text" id="modal-desc"></div>
      </div>
      <div class="modal-close-tip">轻触任意空白处返回</div>
    </div>

    <!-- 阶段 3 -->
    <div class="stage" id="stage-cake">
      <h2 style="font-size: 22px; color: #ff9ab2; margin-bottom: 8px;">🎂 许个愿望吧</h2>
      <div style="font-size: 13px; color: #aaa;">新的一岁，万事顺意</div>
      <div class="cake">
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
        <div class="cake-tier2"></div>
        <div class="cake-tier1"></div>
      </div>
      <button class="blow-btn" id="btn-blow">点击吹灭蜡烛 💨</button>
    </div>

    <!-- 阶段 4 -->
    <div class="stage" id="stage-final">
      <div class="final-content">
        <div class="final-title">生日快乐！🎉</div>
        <div class="final-sub">眼里有光，心想事成，永远做最被宠爱的小女孩！</div>
        <div class="coupons-list">
          <div class="coupon-card">
            <div class="coupon-info">
              <div class="coupon-title">🥤 随叫随到奶茶券</div>
              <div class="coupon-desc">想喝任意果茶奶茶，哥哥全包代点</div>
            </div>
            <div class="coupon-tag">点击领用</div>
          </div>
          <div class="coupon-card">
            <div class="coupon-info">
              <div class="coupon-title">🛡️ 免挨训特权护身符</div>
              <div class="coupon-desc">惹老妈生气时哥哥出面全力顶包</div>
            </div>
            <div class="coupon-tag">点击领用</div>
          </div>
          <div class="coupon-card">
            <div class="coupon-info">
              <div class="coupon-title">🏃 专属跑腿赞助卡</div>
              <div class="coupon-desc">大件快递、深夜宵夜随叫随到代劳</div>
            </div>
            <div class="coupon-tag">点击领用</div>
          </div>
        </div>
        <div class="footer-note">Happy 0927 · Built with ❤️ by Your Brother</div>
      </div>
    </div>
  </div>

    ];

    const DESCS = [
      "名场面其一：可爱值拉满时刻 ✨",
      "生活碎片：无论哪天都要开怀大笑 🎈",
      "记录这一刻：愿所有美好如约而至 🌸",
      "搞怪日常：全世界最酷的小姑娘 🍧",
      "捕捉瞬间：时光里的专属定格 📷",
      "高光时刻：新的一岁继续闪闪发光 💫"
    ];

    let currentPass = "";
    const visited = new Set();
    let audioCtx = null;

    // 音频安全启动器：不会因手机浏览器策略报错中断 JS 执行
    function playTone(freq, duration = 0.25) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {
        // 手机端音频降级保护
      }
    }

    function bindTouch(element, callback) {
      if (!element) return;
      let triggered = false;
      element.addEventListener('pointerdown', (e) => {
        triggered = true;
        callback(e);
      }, { passive: false });
      element.addEventListener('click', (e) => {
        if (!triggered) callback(e);
        triggered = false;
      });
    }

    function toStage(id) {
      document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) target.classList.add('active');
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById("d" + i);
        if (d) {
          if (i < currentPass.length) d.classList.add("filled");
          else d.classList.remove("filled");
        }
      }
    }

    function handleKey(k) {
      playTone(400 + parseInt(k) * 50, 0.2);
      if (currentPass.length < 4) {
        currentPass += k;
        updateDots();
        if (currentPass === "0927") {
          setTimeout(() => {
            toStage('stage-balloons');
            startMusicBox();
          }, 200);
        } else if (currentPass.length === 4) {
          setTimeout(() => {
            currentPass = "";
            updateDots();
          }, 350);
        }
      }
    }

    // 绑定数字按键
    document.querySelectorAll('.key[data-k]').forEach(btn => {
      bindTouch(btn, (e) => {
        e.preventDefault();
        handleKey(btn.getAttribute('data-k'));
      });
    });

    bindTouch(document.getElementById('btn-clear'), (e) => {
      e.preventDefault();
      currentPass = "";
      updateDots();
    });

    bindTouch(document.getElementById('btn-back'), (e) => {
      e.preventDefault();
      currentPass = currentPass.slice(0, -1);
      updateDots();
    });

    // 气球事件
    document.querySelectorAll('.balloon-wrapper').forEach(b => {
      bindTouch(b, (e) => {
        e.preventDefault();
        const idx = parseInt(b.getAttribute('data-idx'));
        openPhoto(idx);
      });
    });

    function openPhoto(idx) {
      playTone(600 + idx * 60, 0.25);
      visited.add(idx);
      document.getElementById('explore-progress').innerText = `已探索: ${visited.size} / 6`;
      if (visited.size === 6) {
        document.getElementById('btn-to-cake').style.display = 'block';
      }
      document.getElementById('modal-img').src = PHOTOS[idx];
      document.getElementById('modal-desc').innerText = DESCS[idx];
      document.getElementById('photo-modal').style.display = 'flex';
    }

    bindTouch(document.getElementById('photo-modal'), () => {
      document.getElementById('photo-modal').style.display = 'none';
    });

    bindTouch(document.getElementById('polaroid-card'), (e) => {
      e.stopPropagation();
    });

    bindTouch(document.getElementById('btn-to-cake'), (e) => {
      e.preventDefault();
      toStage('stage-cake');
    });

    bindTouch(document.getElementById('btn-blow'), (e) => {
      e.preventDefault();
      const flame = document.getElementById('flame');
      if (flame) {
        flame.style.opacity = '0';
        flame.style.transform = 'scale(0)';
      }
      playTone(523.25, 0.5);
      setTimeout(() => {
        toStage('stage-final');
        initFireworks();
      }, 400);
    });

    document.querySelectorAll('.coupon-tag').forEach(tag => {
      bindTouch(tag, (e) => {
        e.preventDefault();
        tag.innerText = "已领用 ✓";
        tag.classList.add("used");
        playTone(880, 0.2);
      });
    });

    // 八音盒循环播放
    function startMusicBox() {
      const notes = [
        { f: 264, d: 0.3, pause: 0.4 },
        { f: 264, d: 0.2, pause: 0.3 },
        { f: 297, d: 0.5, pause: 0.6 },
        { f: 264, d: 0.5, pause: 0.6 },
        { f: 352, d: 0.5, pause: 0.6 },
        { f: 330, d: 0.9, pause: 1.1 }
      ];
      let i = 0;
      function loop() {
        const n = notes[i % notes.length];
        playTone(n.f * 1.5, n.d);
        i++;
        setTimeout(loop, n.pause * 1000);
      }
      loop();
    }

    // 烟花画布
    function initFireworks() {
      const canvas = document.getElementById('canvas-fireworks');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = [];
      function addFirework(x, y) {
        const colors = ['#ff758c', '#4facfe', '#43e97b', '#fa709a', '#f6d365', '#ffffff'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 1.5;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: col
          });
        }
      }

      function render() {
        ctx.clearRect(0, 0, w, h);
        if (Math.random() < 0.08) {
          addFirework(Math.random() * (w - 60) + 30, Math.random() * (h * 0.4) + 60);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05;
          p.alpha -= 0.02;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        requestAnimationFrame(render);
      }
      render();
    }
  </script>
